version: '3'

services:
  app:
    image: node:18
    ports:
      - 4321:4321
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./:/app

  # Production build served by nginx: docker compose up --build web -> http://localhost:8080
  web:
    build: .
    ports:
      - 8080:80
